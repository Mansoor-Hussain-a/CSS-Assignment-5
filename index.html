<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="formSide">
        <img src="./Images/logo.png" alt="logo" class="logoImg" />
        <h1 class="formHeading">Log into your Account</h1>
        <div class="inputFields">
          <div class="inputDiv">
            <img src="./Images/emailIcon.svg" />
            <input type="text" placeholder="iamchis_wallace@email.com" />
          </div>
          <div class="inputDiv">
            <img src="./Images/lockIcon.svg" alt="lock" />
            <input type="text" />
            <img src="./Images/eyeIcon.svg" alt="eye" />
          </div>
          <p class="subtitle">Forgot Password?</p>
        </div>
        <div class="bottomGroup">
          <button class="signIn">Sign in</button>
          <div class="orDiv">
            <div class="line"></div>
            <p>or</p>
            <div class="line"></div>
          </div>
          <div class="signInList">
            <div class="signInItems">
              <img src="./Images/Google.svg" alt="" />
              <p>Sign in with Google</p>
            </div>
            <div class="signInItems">
              <img src="./Images/facebook.svg" alt="" />
              <p>Sign in with Facebook</p>
            </div>
            <div class="signInItems">
              <img src="./Images/Apple.svg" alt="" />
              <p>Sign in with Apple</p>
            </div>
          </div>
          <div class="createAccount">
            <p>Don’t have an account?</p>
            <a href="">Create Account</a>
          </div>
        </div>
      </div>
      <div class="imageSide"></div>
    </div>
  </body>
</html>
